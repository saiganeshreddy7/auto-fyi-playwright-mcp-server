[project]
name = "autofyi-mcp"
version = "0.3.0"
description = "Safety-first MCP server for the AutoFYI REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp[cli]>=1.28.1,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
autofyi-mcp = "autofyi_mcp.server:main"
autofyi-mcp-smoke = "autofyi_mcp.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autofyi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
