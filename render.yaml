services:
  - type: web
    name: autofyi-mcp
    runtime: python
    plan: starter
    buildCommand: pip install .
    startCommand: autofyi-mcp
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: AUTOFYI_MCP_TRANSPORT
        value: streamable-http
      # Comma-separated bearer tokens, one per teammate. Clients send
      # "Authorization: Bearer <token>". Starts with one generated token.
      - key: AUTOFYI_MCP_AUTH_TOKENS
        generateValue: true
      - key: AUTOFYI_API_BASE
        value: https://autofyi.kellyautomations.com
      # Financial writes stay off until flipped deliberately in the dashboard.
      - key: AUTOFYI_ENABLE_WRITES
        value: "false"
      - key: AUTOFYI_READ_TIMEOUT_SECONDS
        value: "600"
      # Optional: Cloudflare Access service token protecting the tunnel.
      - key: AUTOFYI_CF_ACCESS_CLIENT_ID
        sync: false
      - key: AUTOFYI_CF_ACCESS_CLIENT_SECRET
        sync: false
